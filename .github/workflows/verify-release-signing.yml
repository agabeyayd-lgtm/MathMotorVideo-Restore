name: Verify release signing continuity

on:
  workflow_dispatch:
  # Verify only after the signed APK publication has completed. This avoids
  # racing the publisher and comparing a new version against the older latest tag.
  workflow_run:
    workflows:
      - "Build and publish APK"
    types:
      - completed
  # Exercise modifications to this verifier immediately.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-release-signing.yml"

permissions:
  contents: read

concurrency:
  group: verify-release-signing-main
  cancel-in-progress: false

jobs:
  compare-signing-certificates:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12266719"
          accept-android-sdk-licenses: true
          packages: "platform-tools build-tools;36.0.0"

      - name: Verify Android build tools
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"

      - name: Download latest and previous signed releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_code="$(grep -E 'versionCode[[:space:]]*=' app/build.gradle.kts | head -1 | grep -oE '[0-9]+')"
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest")"
          latest_tag="$(printf '%s' "$release_json" | jq -r '.tag_name')"
          latest_code="$(RELEASE_JSON="$release_json" python3 -c 'import json,os,re; body=json.loads(os.environ["RELEASE_JSON"]).get("body") or ""; m=re.search(r"versionCode\s*=\s*(\d+)", body, re.I); print(m.group(1) if m else "")')"
          echo "Expected app versionCode: $expected_code"
          echo "Latest signed release: $latest_tag (versionCode=$latest_code)"
          if [ "$latest_code" != "$expected_code" ]; then
            echo "::error::Latest signed release versionCode '$latest_code' does not match app/build.gradle.kts '$expected_code'."
            exit 1
          fi

          releases_json="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          releases_file="$RUNNER_TEMP/releases.json"
          printf '%s' "$releases_json" > "$releases_file"
          previous_record="$(python3 - "$releases_file" "$expected_code" <<'PY'
          import json
          import sys
          import re
          from pathlib import Path

          releases = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = int(sys.argv[2])
          candidates = []
          for release in releases:
              if release.get("draft") or release.get("prerelease"):
                  continue
              if not any(asset.get("name") == "MathMotorVideo.apk" for asset in release.get("assets", [])):
                  continue
              match = re.search(r"versionCode\s*=\s*(\d+)", release.get("body") or "", re.I)
              if not match:
                  continue
              code = int(match.group(1))
              if code < expected:
                  candidates.append((code, release.get("tag_name", "")))
          if not candidates:
              raise SystemExit("No previous published signed APK with a lower versionCode was found.")
          code, tag = max(candidates)
          print(f"{tag}|{code}")
          PY
          )"
          previous_tag=""
          previous_code=""
          IFS='|' read -r previous_tag previous_code <<< "$previous_record"
          if [ -z "$previous_tag" ] || [ -z "$previous_code" ]; then
            echo "::error::Could not resolve the previous signed release."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/published-release" "$RUNNER_TEMP/previous-release"
          gh release download "$latest_tag" --repo "$GITHUB_REPOSITORY" --pattern "MathMotorVideo.apk" --dir "$RUNNER_TEMP/published-release"
          gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" --pattern "MathMotorVideo.apk" --dir "$RUNNER_TEMP/previous-release"
          test -s "$RUNNER_TEMP/published-release/MathMotorVideo.apk"
          test -s "$RUNNER_TEMP/previous-release/MathMotorVideo.apk"
          echo "PUBLISHED_APK=$RUNNER_TEMP/published-release/MathMotorVideo.apk" >> "$GITHUB_ENV"
          echo "PUBLISHED_TAG=$latest_tag" >> "$GITHUB_ENV"
          echo "PUBLISHED_VERSION_CODE=$latest_code" >> "$GITHUB_ENV"
          echo "PREVIOUS_APK=$RUNNER_TEMP/previous-release/MathMotorVideo.apk" >> "$GITHUB_ENV"
          echo "PREVIOUS_TAG=$previous_tag" >> "$GITHUB_ENV"
          echo "PREVIOUS_VERSION_CODE=$previous_code" >> "$GITHUB_ENV"

      - name: Test every configured signing source without publishing
        env:
          MMV_SIGNING_BUNDLE_B64: ${{ secrets.MMV_SIGNING_BUNDLE_B64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_HOME-}" ] || [ ! -d "$ANDROID_HOME/build-tools" ]; then
            echo "::error::Android SDK build-tools directory is unavailable (ANDROID_HOME=${ANDROID_HOME- unset})."
            exit 1
          fi
          apksigner_path="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          if [ ! -x "$apksigner_path" ]; then
            echo "::error::apksigner 36.0.0 was not found at $apksigner_path."
            find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -print || true
            exit 1
          fi
          echo "Using apksigner: $apksigner_path"
          if ! published_verify_output="$("$apksigner_path" verify --print-certs "$PUBLISHED_APK" 2>&1)"; then
            printf '%s\n' "$published_verify_output"
            echo "::error::apksigner could not verify the published APK."
            exit 1
          fi
          published_fingerprint="$(printf '%s\n' "$published_verify_output" | awk -F': *' 'tolower($1) ~ /signer #1 certificate sha-256 digest/ {print $2; exit}')"
          if [ -z "$published_fingerprint" ]; then
            printf '%s\n' "$published_verify_output"
            echo "::error::apksigner output did not contain the expected SHA-256 certificate field."
            exit 1
          fi

          previous_verify_output="$("$apksigner_path" verify --print-certs "$PREVIOUS_APK" 2>&1)" || {
            printf '%s\n' "$previous_verify_output"
            echo "::error::apksigner could not verify the previous signed APK ($PREVIOUS_TAG)."
            exit 1
          }
          previous_fingerprint="$(printf '%s\n' "$previous_verify_output" | awk -F': *' 'tolower($1) ~ /signer #1 certificate sha-256 digest/ {print $2; exit}')"
          if [ -z "$previous_fingerprint" ]; then
            printf '%s\n' "$previous_verify_output"
            echo "::error::Previous APK signer SHA-256 could not be read."
            exit 1
          fi
          echo "Previous signed release: $PREVIOUS_TAG (versionCode=$PREVIOUS_VERSION_CODE)"
          echo "Previous signer SHA-256: $previous_fingerprint"
          if [ "$published_fingerprint" != "$previous_fingerprint" ]; then
            echo "::error::New release signer does not match the previous published release. In-app update continuity is not safe."
            echo "New=$published_fingerprint Previous=$previous_fingerprint"
            exit 1
          fi
          echo "New release certificate matches the previous published release."
          echo "- Previous release: $PREVIOUS_TAG (versionCode=$PREVIOUS_VERSION_CODE)" >> "$GITHUB_STEP_SUMMARY"
          echo "- New release: $PUBLISHED_TAG (versionCode=$PUBLISHED_VERSION_CODE)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Certificate continuity: MATCH" >> "$GITHUB_STEP_SUMMARY"

          echo "Published release tag: $PUBLISHED_TAG"
          echo "Published signer SHA-256: $published_fingerprint"
          echo "## Release signing continuity — $PUBLISHED_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- Published signer SHA-256: \`$published_fingerprint\`" >> "$GITHUB_STEP_SUMMARY"

          normalize_properties() {
            python3 - "$1" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          lines = path.read_text(encoding="ISO-8859-1").splitlines()
          properties = {}
          for line in lines:
              if line and not line.lstrip().startswith(("#", "!")) and "=" in line:
                  key, value = line.split("=", 1)
                  properties[key.strip()] = value.strip()

          store_type = properties.get("storeType", "PKCS12").strip().upper()
          if store_type == "PKCS12":
              store_password = properties.get("storePassword")
              if store_password is None:
                  raise SystemExit("Signing configuration is missing storePassword.")
              output = []
              replaced = False
              for line in lines:
                  if line.startswith("keyPassword="):
                      output.append("keyPassword=" + store_password)
                      replaced = True
                  else:
                      output.append(line)
              if not replaced:
                  output.append("keyPassword=" + store_password)
              path.write_text("\n".join(output) + "\n", encoding="ISO-8859-1")
              print("PKCS12 key password normalized.")
          else:
              print("Non-PKCS12 signing configuration preserved.")
          PY
          }

          try_candidate() {
            source_name="$1"
            properties_file="$2"
            echo "::group::Compare $source_name"
            if ! MMV_SIGNING_PROPERTIES="$properties_file" gradle --no-daemon clean assembleRelease; then
              echo "::warning::$source_name could not build a comparison APK."
              echo "- $source_name: BUILD FAILED" >> "$GITHUB_STEP_SUMMARY"
              echo "::endgroup::"
              return 1
            fi

            candidate="app/build/outputs/apk/release/app-release.apk"
            if [ ! -s "$candidate" ]; then
              echo "::warning::$source_name produced no comparison APK."
              echo "- $source_name: APK MISSING" >> "$GITHUB_STEP_SUMMARY"
              echo "::endgroup::"
              return 1
            fi

            candidate_fingerprint="$("$apksigner_path" verify --print-certs "$candidate" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}')"
            if [ -z "$candidate_fingerprint" ]; then
              echo "::warning::$source_name produced an APK without a readable signer certificate."
              echo "- $source_name: SIGNER UNREADABLE" >> "$GITHUB_STEP_SUMMARY"
              echo "::endgroup::"
              return 1
            fi

            echo "$source_name signer SHA-256: $candidate_fingerprint"
            echo "- $source_name signer SHA-256: \`$candidate_fingerprint\`" >> "$GITHUB_STEP_SUMMARY"
            if [ "$candidate_fingerprint" = "$published_fingerprint" ]; then
              echo "::notice::$source_name MATCHES the published release signer."
              echo "- $source_name result: MATCH" >> "$GITHUB_STEP_SUMMARY"
              echo "::endgroup::"
              return 0
            fi

            echo "::warning::$source_name does not match the published release signer."
            echo "- $source_name result: MISMATCH" >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
            return 1
          }

          # Match the exact precedence used by publish-apk.yml. The publisher
          # never falls back to legacy secrets when the bundle secret is present.
          if [ -n "$MMV_SIGNING_BUNDLE_B64" ]; then
            echo "Publisher-selected signing source: MMV_SIGNING_BUNDLE_B64"
            bundle_dir="$RUNNER_TEMP/mmv-signing-bundle"
            mkdir -p "$bundle_dir"
            if ! printf '%s' "$MMV_SIGNING_BUNDLE_B64" | base64 --decode > "$bundle_dir/bundle.zip" \
              || ! unzip -oq "$bundle_dir/bundle.zip" -d "$bundle_dir" \
              || [ ! -s "$bundle_dir/release.p12" ] \
              || [ ! -s "$bundle_dir/keystore.properties" ]; then
              echo "::error::The publisher-selected MMV_SIGNING_BUNDLE_B64 could not be restored."
              exit 1
            fi
            normalize_properties "$bundle_dir/keystore.properties"
            if ! try_candidate "MMV_SIGNING_BUNDLE_B64 (publisher-selected)" "$bundle_dir/keystore.properties"; then
              echo "::error::The signing bundle selected by the publisher does not match the published release certificate."
              exit 1
            fi
          elif [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] \
            && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "Publisher-selected signing source: ANDROID_KEYSTORE_*"
            legacy_dir="$RUNNER_TEMP/mmv-signing-legacy"
            mkdir -p "$legacy_dir"
            if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$legacy_dir/release.p12"; then
              echo "::error::The publisher-selected legacy keystore could not be decoded."
              exit 1
            fi
            {
              printf 'storeFile=release.p12\n'
              printf 'storeType=PKCS12\n'
              printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
              printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
              printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            } > "$legacy_dir/keystore.properties"
            normalize_properties "$legacy_dir/keystore.properties"
            if ! try_candidate "ANDROID_KEYSTORE_* (publisher-selected)" "$legacy_dir/keystore.properties"; then
              echo "::error::The legacy signing source selected by the publisher does not match the published release certificate."
              exit 1
            fi
          else
            echo "::error::No complete publisher-supported release signing source is configured."
            exit 1
          fi

          echo "The exact signing source selected by the publisher matches the published release certificate. No release was published."
          echo "- Overall result: MATCH (publisher-selected source)" >> "$GITHUB_STEP_SUMMARY"
