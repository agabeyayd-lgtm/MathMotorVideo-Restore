name: Android emulator screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/editor-395-gate
    paths:
      - "app/build.gradle.kts"
      - "app/src/main/**"
      - "app/src/debug/**"
      - "app/src/test/**"
      - "app/src/androidTest/**"
      - ".github/workflows/android-emulator-screenshots.yml"
      - ".github/scripts/capture-emulator-screenshots.sh"
      - ".github/scripts/run-android-instrumentation-tests.sh"

permissions:
  contents: read

concurrency:
  group: android-emulator-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Install ffmpeg for deterministic audio fixture
        # The hosted runner mirror downloaded only part of the 62.8 MB ffmpeg
        # dependency set in 120 seconds; allow a realistic transfer window while
        # keeping the whole setup step bounded before emulator instrumentation.
        timeout-minutes: 16
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            timeout 240s sudo apt-get update -qq
            timeout 660s sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Prepare deterministic MP4 fixtures
        run: |
          set -euo pipefail
          mkdir -p app/build/test-fixtures
          echo "Decoding checked-in offline fixture payloads"
          base64 --decode ci-fixtures/editor-test-video.mp4.b64 > app/build/test-fixtures/editor-test-video.mp4
          base64 --decode ci-fixtures/editor-test-video-second.mp4.b64 > app/build/test-fixtures/editor-test-video-second.mp4
          test -s app/build/test-fixtures/editor-test-video.mp4
          test -s app/build/test-fixtures/editor-test-video-second.mp4
          command -v ffmpeg
          command -v ffprobe
          # Add a deterministic 220 Hz source-audio track to the existing offline video.
          # 4x the sine filter's default 1/8 amplitude makes the 40% gain measurable.
          ffmpeg -nostdin -hide_banner -loglevel error -y \
            -i app/build/test-fixtures/editor-test-video.mp4 \
            -f lavfi -i "sine=frequency=220:sample_rate=44100:duration=8.02" \
            -map 0:v:0 -map 1:a:0 -c:v copy -af "volume=4.0" \
            -c:a aac -b:a 192k -shortest \
            app/build/test-fixtures/editor-test-video-with-audio.mp4
          test -s app/build/test-fixtures/editor-test-video-with-audio.mp4
          ffprobe -v error -show_entries stream=codec_type,codec_name,sample_rate,channels \
            -of default=noprint_wrappers=1 app/build/test-fixtures/editor-test-video-with-audio.mp4
          echo "Fixture sizes:"
          wc -c app/build/test-fixtures/editor-test-video.mp4 app/build/test-fixtures/editor-test-video-second.mp4 app/build/test-fixtures/editor-test-video-with-audio.mp4
          echo "Fixture stream metadata:"
          for f in app/build/test-fixtures/editor-test-video.mp4 app/build/test-fixtures/editor-test-video-second.mp4; do
            printf '%s: ' "$f"
            head -c 12 "$f" | od -An -tx1
          done
          echo "Both deterministic fixtures are ready without external downloads"

      - name: Enable KVM acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ -e /dev/kvm ]; then
            sudo chmod 0666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "WARNING: /dev/kvm is unavailable; emulator may run without hardware acceleration"
          fi

      - name: Launch app, capture screens, and run interaction tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          # Use the current Google APIs image; the Android 30 AOSP ATD package
          # could not be resolved by sdkmanager on the hosted runner.
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          force-avd-creation: true
          emulator-port: 5554
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data
          emulator-boot-timeout: 600
          script: |
            bash .github/scripts/capture-emulator-screenshots.sh
            bash .github/scripts/run-android-instrumentation-tests.sh

      - name: Upload emulator screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathmotor-android-emulator-screenshots
          path: emulator-screenshots/
          if-no-files-found: warn
          retention-days: 14
