name: Android emulator screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/build.gradle.kts"
      - "app/src/main/**"
      - ".github/workflows/android-emulator-screenshots.yml"

permissions:
  contents: read

jobs:
  emulator-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Launch app and capture screen without instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data
          script: |
            set -e
            mkdir -p emulator-screenshots
            adb wait-for-device
            adb shell am start -W -n com.mathmotor.video.next/com.mathmotor.video.MainActivity
            sleep 8
            adb shell screencap -p /sdcard/home.png
            adb pull /sdcard/home.png emulator-screenshots/home.png
            adb shell uiautomator dump /sdcard/window.xml || true
            adb pull /sdcard/window.xml emulator-screenshots/window.xml || true
            adb logcat -d > emulator-screenshots/logcat.txt

      - name: Upload emulator screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathmotor-android-emulator-screenshots
          path: |
            emulator-screenshots/
          if-no-files-found: warn
          retention-days: 14
