name: Android emulator screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/build.gradle.kts"
      - "app/src/main/**"
      - ".github/workflows/android-emulator-screenshots.yml"

permissions:
  contents: read

concurrency:
  group: android-emulator-screenshots
  cancel-in-progress: true

jobs:
  emulator-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Launch app and capture screen without instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data
          script: |
            set -e
            mkdir -p emulator-screenshots
            adb wait-for-device
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.mathmotor.video.next || true
            adb shell monkey -p com.mathmotor.video.next 1
            sleep 10

            # Cold Android 11 emulators sometimes display a system ANR dialog
            # during first boot. Tap its explicit "Wait" action and recapture,
            # rather than uploading a dimmed screenshot of the dialog.
            capture_clear_screen() {
              destination="$1"
              hierarchy="$2"
              hierarchy_path="emulator-screenshots/$hierarchy"
              for attempt in 1 2 3 4; do
                adb shell rm -f "/sdcard/$hierarchy" >/dev/null 2>&1 || true
                timeout 12s adb shell uiautomator dump "/sdcard/$hierarchy" >/dev/null 2>&1 || true
                adb pull "/sdcard/$hierarchy" "$hierarchy_path" >/dev/null 2>&1 || true
                if grep -q "isn't responding" "$hierarchy_path" 2>/dev/null; then
                  point="$(python3 - "$hierarchy_path" <<'PY'
            import re, sys, xml.etree.ElementTree as ET
            try:
                root = ET.parse(sys.argv[1]).getroot()
                for node in root.iter("node"):
                    if node.attrib.get("text", "").strip().lower() == "wait" and node.attrib.get("clickable") == "true":
                        match = re.fullmatch(r"\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\]", node.attrib.get("bounds", ""))
                        if match:
                            x1, y1, x2, y2 = map(int, match.groups())
                            print(f"{(x1 + x2) // 2} {(y1 + y2) // 2}")
                            break
            except Exception:
                pass
            PY
            )"
                  if [ -z "$point" ]; then
                    echo "Android system ANR dialog found, but the Wait button could not be located."
                    return 1
                  fi
                  echo "Android system ANR dialog found; choosing Wait (attempt $attempt/4)."
                  adb shell input tap $point
                  sleep 4
                  continue
                fi
                adb exec-out screencap -p > "$destination"
                test -s "$destination"
                return 0
              done
              echo "Android system ANR dialog remained after recovery attempts."
              return 1
            }

            capture_clear_screen emulator-screenshots/home.png window.xml

            python3 - <<'PY'
            import re
            import subprocess
            import sys
            import xml.etree.ElementTree as ET

            try:
                root = ET.parse("emulator-screenshots/window.xml").getroot()
            except Exception as exc:
                print(f"Could not parse home UI hierarchy: {exc}")
                sys.exit(1)

            nodes = []
            for node in root.iter("node"):
                label = " ".join((node.attrib.get("text", ""), node.attrib.get("content-desc", ""))).strip()
                match = re.fullmatch(r"\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\]", node.attrib.get("bounds", ""))
                if match:
                    x1, y1, x2, y2 = map(int, match.groups())
                    nodes.append((label, (x1 + x2) // 2, (y1 + y2) // 2))

            preferred = ("Boş proje oluştur", "Boş düzenleyiciyi aç", "Yeni düzenleme başlat")
            chosen = None
            for target in preferred:
                chosen = next((item for item in nodes if target in item[0]), None)
                if chosen:
                    break
            if chosen is None:
                chosen = next((item for item in nodes if "Galeriden video seç" in item[0]), None)
            if chosen is None:
                print("No usable home action button found in UI hierarchy.")
                sys.exit(2)

            label, x, y = chosen
            print(f"Opening editor from home button: {label} at {x},{y}")
            subprocess.run(["adb", "shell", "input", "tap", str(x), str(y)], check=True)
            PY
            sleep 5
            capture_clear_screen emulator-screenshots/editor.png editor-window.xml
            adb logcat -d > emulator-screenshots/logcat.txt
            test -s emulator-screenshots/home.png
            test -s emulator-screenshots/editor.png

      - name: Upload emulator screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathmotor-android-emulator-screenshots
          path: |
            emulator-screenshots/
          if-no-files-found: warn
          retention-days: 14
