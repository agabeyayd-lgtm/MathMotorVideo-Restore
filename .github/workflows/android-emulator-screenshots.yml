name: Android emulator screenshots
# PR synchronize changes run this smoke test on the current head; workflow_dispatch remains available for manual PR-head verification.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "app/build.gradle.kts"
      - "app/src/main/**"
      - ".github/workflows/android-emulator-screenshots.yml"
      - ".github/scripts/capture-emulator-screenshots.sh"
      - ".github/scripts/assert-thumbnail-alignment.py"
  push:
    branches:
      - main
    paths:
      - "app/build.gradle.kts"
      - "app/src/main/**"
      - ".github/workflows/android-emulator-screenshots.yml"
      - ".github/scripts/capture-emulator-screenshots.sh"
      - ".github/scripts/assert-thumbnail-alignment.py"

permissions:
  contents: read

concurrency:
  # Isolate each source revision so a wedged emulator run from an older commit
  # cannot hold the lock for the latest PR head. Duplicate runs of one SHA replace each other.
  group: android-emulator-screenshots-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  emulator-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests and build debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Package the tested debug APK as a ZIP
        run: |
          mkdir -p debug-apk-delivery
          cp app/build/outputs/apk/debug/app-debug.apk debug-apk-delivery/MathMotor-debug.apk
          (cd debug-apk-delivery && zip -q MathMotor-debug.zip MathMotor-debug.apk)
          test -s debug-apk-delivery/MathMotor-debug.zip

      - name: Upload installable debug APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: mathmotor-debug-apk-zip
          path: debug-apk-delivery/MathMotor-debug.zip
          if-no-files-found: error
          retention-days: 14

      - name: Set up FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg_archive="$RUNNER_TEMP/ffmpeg-release-amd64-static.tar.xz"
          ffmpeg_dir="$RUNNER_TEMP/ffmpeg-static"
          mkdir -p "$ffmpeg_dir"
          # Download the stable static archive directly. The setup action's
          # release discovery now depends on an upstream README version line
          # that is no longer present; bypass that metadata parser entirely.
          curl --fail --location --retry 3 --retry-delay 2 \
            https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
            --output "$ffmpeg_archive"
          test -s "$ffmpeg_archive"
          tar -xJf "$ffmpeg_archive" -C "$ffmpeg_dir"
          ffmpeg_binary="$(find "$ffmpeg_dir" -maxdepth 3 -type f -name ffmpeg -print -quit)"
          ffprobe_binary="$(find "$ffmpeg_dir" -maxdepth 3 -type f -name ffprobe -print -quit)"
          test -x "$ffmpeg_binary"
          test -x "$ffprobe_binary"
          chmod +x "$ffmpeg_binary" "$ffprobe_binary"
          ffmpeg_bin_dir="$(dirname "$ffmpeg_binary")"
          echo "$ffmpeg_bin_dir" >> "$GITHUB_PATH"
          "$ffmpeg_binary" -version | head -n 1
          "$ffprobe_binary" -version | head -n 1

      - name: Generate a deterministic sample video for editor smoke tests
        run: |
          command -v ffmpeg
          ffmpeg -version | head -n 1
          mkdir -p app/build/test-fixtures
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "color=c=red:s=360x640:r=24" \
            -f lavfi -i "sine=frequency=440:sample_rate=44100" \
            -t 8 -vf "hue=h='t*90':s=1" -c:v mpeg4 -q:v 5 -pix_fmt yuv420p \
            -c:a aac -b:a 64k -shortest \
            app/build/test-fixtures/editor-test-video.mp4
          test -s app/build/test-fixtures/editor-test-video.mp4
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "color=c=magenta:s=256x128" -frames:v 1 app/build/test-fixtures/editor-test-overlay.png
          test -s app/build/test-fixtures/editor-test-overlay.png
          # Portrait sample matches the default 9:16 project canvas and is used
          # to prove that the home-screen photo route fills the editable canvas.
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "color=c=magenta:s=360x640" -frames:v 1 app/build/test-fixtures/editor-test-photo.png
          test -s app/build/test-fixtures/editor-test-photo.png
          # Keep the replacement clip green enough to detect stale red frames,
          # while a monotonic 24-degree/sec hue shift makes sampled timestamps distinct.
          # Preflighted locally against the exact 8 frame-diversity sample times:
          # 8/8 unique fingerprints and 100% green pixels (test minimum is 75%).
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "color=c=lime:s=360x640:r=24" \
            -f lavfi -i "sine=frequency=660:sample_rate=44100" \
            -t 8 -vf "hue=h='t*24'" -c:v mpeg4 -q:v 5 -pix_fmt yuv420p \
            -c:a aac -b:a 64k -shortest \
            app/build/test-fixtures/editor-test-video-replacement.mp4
          test -s app/build/test-fixtures/editor-test-video-replacement.mp4
          # Two deterministic PCM fixtures feed the production audio-import path
          # so the timeline smoke can drag music and sound-effect edge targets.
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "sine=frequency=523:sample_rate=48000:duration=1.6" \
            -ac 2 -c:a pcm_s16le app/build/test-fixtures/editor-test-music.wav
          test -s app/build/test-fixtures/editor-test-music.wav
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "sine=frequency=784:sample_rate=48000:duration=1.4" \
            -ac 2 -c:a pcm_s16le app/build/test-fixtures/editor-test-sound.wav
          test -s app/build/test-fixtures/editor-test-sound.wav
          ls -lh app/build/test-fixtures/editor-test-video.mp4 app/build/test-fixtures/editor-test-overlay.png app/build/test-fixtures/editor-test-photo.png app/build/test-fixtures/editor-test-video-replacement.mp4 app/build/test-fixtures/editor-test-music.wav app/build/test-fixtures/editor-test-sound.wav

      - name: Enable KVM acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ -e /dev/kvm ]; then
            sudo chmod 0666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "WARNING: /dev/kvm is unavailable; emulator may run without hardware acceleration"
          fi

      - name: Install Android SDK emulator packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -e
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" "platforms;android-35" "emulator" "system-images;android-35;google_apis;x86_64"
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force --name mathmotor-api35 \
            --package "system-images;android-35;google_apis;x86_64" --device "pixel_2"
          test -s "$ANDROID_AVD_HOME/mathmotor-api35.ini"
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" list avd

      - name: Boot emulator, run smoke tests, and shut it down
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          emulator -list-avds
          test -s "$ANDROID_AVD_HOME/mathmotor-api35.ini"
          emulator -avd mathmotor-api35 -port 5554 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data > /tmp/mathmotor-emulator.log 2>&1 &
          emulator_pid=$!
          cleanup_emulator() {
            adb -s emulator-5554 emu kill >/dev/null 2>&1 || true
            # Do not let a stuck emulator launcher keep the entire Actions
            # step open after the smoke-test script has already exited.
            if ! timeout -k 2s 8s tail --pid="$emulator_pid" -f /dev/null; then
              echo "Emulator did not stop cleanly; sending SIGKILL."
              kill -KILL "$emulator_pid" >/dev/null 2>&1 || true
            fi
            wait "$emulator_pid" 2>/dev/null || true
          }
          trap cleanup_emulator EXIT

          timeout -k 2s 8s adb start-server || true
          device_state=""
          # Bound ADB startup: wait-for-device can hang indefinitely when the
          # emulator process fails before registering its transport.
          for attempt in $(seq 1 90); do
            device_state="$(timeout -k 1s 4s adb -s emulator-5554 get-state 2>/dev/null || true)"
            if [ "$device_state" = "device" ]; then break; fi
            echo "Waiting for emulator ADB transport (attempt $attempt/90; state='$device_state')"
            sleep 2
          done
          if [ "$device_state" != "device" ]; then
            echo "Emulator never became visible to ADB; process list and boot log follow:"
            ps -ef | grep -E '[e]mulator|[q]emu' || true
            cat /tmp/mathmotor-emulator.log || true
            exit 1
          fi

          boot_completed=""
          for attempt in $(seq 1 120); do
            boot_completed="$(timeout -k 1s 5s adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\\r' || true)"
            if [ "$boot_completed" = "1" ]; then break; fi
            sleep 5
          done
          if [ "$boot_completed" != "1" ]; then
            cat /tmp/mathmotor-emulator.log
            echo "Android emulator did not finish booting within 10 minutes."
            exit 1
          fi

          adb -s emulator-5554 shell settings put global window_animation_scale 0
          adb -s emulator-5554 shell settings put global transition_animation_scale 0
          adb -s emulator-5554 shell settings put global animator_duration_scale 0
          gradle --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.mathmotor.video.VideoProjectDraftBackupTest
          bash .github/scripts/capture-emulator-screenshots.sh

      - name: Upload emulator screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathmotor-android-emulator-screenshots
          path: emulator-screenshots/
          if-no-files-found: warn
          retention-days: 14
