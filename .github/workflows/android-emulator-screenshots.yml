name: Android emulator screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/build.gradle.kts"
      - "app/src/main/**"
      - "app/src/androidTest/**"
      - ".github/workflows/android-emulator-screenshots.yml"

permissions:
  contents: read

jobs:
  emulator-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK and instrumentation APK
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Launch app on Android emulator and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data
          script: |
            set +e
            timeout 240s gradle --no-daemon connectedDebugAndroidTest
            test_status=$?
            mkdir -p emulator-screenshots
            adb pull /sdcard/Android/data/com.mathmotor.video.next.test/files/Pictures/emulator-screenshots emulator-screenshots/ || true
            exit $test_status

      - name: Upload emulator screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathmotor-android-emulator-screenshots
          path: |
            emulator-screenshots/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
