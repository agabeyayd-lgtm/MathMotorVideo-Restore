name: Android emulator screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/build.gradle.kts"
      - "app/src/main/**"
      - ".github/workflows/android-emulator-screenshots.yml"

permissions:
  contents: read

concurrency:
  group: android-emulator-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Launch app and capture screen without instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data
          script: |
            set -e
            mkdir -p emulator-screenshots
            timeout 60s adb wait-for-device
            # Wait for Android boot to finish and for System UI to settle before
            # starting the app. Cold emulators can otherwise show a false system ANR.
            boot_complete=""
            for attempt in 1 2 3 4 5 6; do
              boot_complete="$(timeout 5s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [ "$boot_complete" = "1" ]; then
                break
              fi
              sleep 2
            done
            if [ "$boot_complete" != "1" ]; then
              echo "Android emulator did not report sys.boot_completed=1."
              exit 1
            fi
            sleep 25
            timeout 120s adb install -r app/build/outputs/apk/debug/app-debug.apk
            timeout 10s adb shell am force-stop com.mathmotor.video.next || true
            timeout 20s adb shell monkey -p com.mathmotor.video.next 1
            sleep 10

            # Cold Android 11 emulators may show a System UI ANR prompt on first boot.
            # Select the visible "Wait" button and retry instead of saving a dimmed image.
            capture_clear_screen() {
              destination="$1"
              hierarchy="$2"
              hierarchy_path="emulator-screenshots/$hierarchy"
              for attempt in 1 2 3 4; do
                rm -f "$hierarchy_path"
                timeout 10s adb shell rm -f "/sdcard/$hierarchy" >/dev/null 2>&1 || true
                timeout 12s adb shell uiautomator dump "/sdcard/$hierarchy" >/dev/null 2>&1 || true
                timeout 12s adb pull "/sdcard/$hierarchy" "$hierarchy_path" >/dev/null 2>&1 || true
                if [ ! -s "$hierarchy_path" ]; then
                  echo "Could not read the Android UI hierarchy (attempt $attempt/4)."
                  sleep 2
                  continue
                fi
                if grep -q "isn't responding" "$hierarchy_path" 2>/dev/null; then
                  wait_node="$(grep -o '<node[^>]*text="Wait"[^>]*bounds="\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]"' "$hierarchy_path" | head -n 1 || true)"
                  wait_coords="$(printf '%s\n' "$wait_node" | sed -n 's/.*bounds="\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\]".*/\1 \2 \3 \4/p' | awk '{print int(($1+$3)/2), int(($2+$4)/2)}')"
                  if [ -z "$wait_coords" ]; then
                    echo "System ANR dialog found, but its Wait button could not be located."
                    return 1
                  fi
                  echo "System ANR prompt: choosing Wait (attempt $attempt/4)."
                  timeout 10s adb shell input tap $wait_coords >/dev/null 2>&1 || true
                  sleep 4
                  continue
                fi
                timeout 15s adb exec-out screencap -p > "$destination"
                test -s "$destination"
                return 0
              done
              echo "System ANR prompt remained after four recovery attempts."
              return 1
            }

            capture_clear_screen emulator-screenshots/home.png window.xml

            # Locate the editor-opening action in the hierarchy. Prefer a blank
            # project so the smoke test does not depend on a media-picker app.
            node=""
            for target in "Boş proje oluştur" "Boş düzenleyiciyi aç" "Yeni düzenleme başlat" "Galeriden video seç"; do
              node="$(grep -o '<node[^>]*text="[^"]*'"$target"'[^"]*"[^>]*bounds="\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]"' emulator-screenshots/window.xml | head -n 1 || true)"
              if [ -n "$node" ]; then
                break
              fi
            done
            if [ -z "$node" ]; then
              echo "No usable home action button found in UI hierarchy."
              exit 2
            fi
            coords="$(printf '%s\n' "$node" | sed -n 's/.*bounds="\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\]".*/\1 \2 \3 \4/p' | awk '{print int(($1+$3)/2), int(($2+$4)/2)}')"
            echo "Opening editor at $coords"
            timeout 10s adb shell input tap $coords
            sleep 5
            capture_clear_screen emulator-screenshots/editor.png editor-window.xml
            timeout 15s adb logcat -d > emulator-screenshots/logcat.txt
            test -s emulator-screenshots/home.png
            test -s emulator-screenshots/editor.png

      - name: Upload emulator screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathmotor-android-emulator-screenshots
          path: |
            emulator-screenshots/
          if-no-files-found: warn
          retention-days: 14
