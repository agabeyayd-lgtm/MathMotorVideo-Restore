name: Build MathMotorVideo APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, fix/video-playback-clean-ui ]

permissions:
  contents: read

# Cancel stale runs whenever another commit arrives on the same PR/branch.
concurrency:
  group: mathmotor-video-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Run unit tests and build APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ -e /dev/kvm ]; then
            ls -l /dev/kvm
            if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
              echo "KVM is accessible for the emulator."
            else
              echo "::warning::/dev/kvm exists but is not readable and writable by this runner."
            fi
          else
            echo "::warning::/dev/kvm is not available; emulator may run slowly or become unstable."
          fi
      - name: Run Android editor end-to-end test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          emulator-boot-timeout: 600
          script: bash .github/scripts/run-android-editor-test.sh
      - name: Upload Android test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MathMotorVideo-android-test-diagnostics
          path: |
            app/build/diagnostics/**
            app/build/reports/androidTests/connected/debug/**
            app/build/outputs/androidTest-results/connected/debug/**
          if-no-files-found: warn
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MathMotorVideo-restored-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
