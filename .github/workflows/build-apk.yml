name: Build MathMotorVideo APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, fix/video-playback-clean-ui ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Generate valid MP4 fixture for editor test
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          mkdir -p app/src/androidTest/assets
          ffmpeg -hide_banner -loglevel error -f lavfi -i "color=c=red:s=90x160:r=10:d=2" -an -c:v libx264 -profile:v baseline -level 3.0 -preset ultrafast -crf 40 -pix_fmt yuv420p -movflags +faststart -g 10 -video_track_timescale 90000 -y app/src/androidTest/assets/editor-e2e-source.mp4
          ffprobe -v error -show_entries format=duration:stream=codec_name,width,height -of compact app/src/androidTest/assets/editor-e2e-source.mp4
      - name: Run unit tests and build APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Run Android editor end-to-end test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          emulator-boot-timeout: 600
          script: |
            mkdir -p app/build/diagnostics
            set +e
            echo "Waiting for Android package and activity services" | tee app/build/diagnostics/emulator-readiness.txt
            SERVICE_READY=0
            for i in $(seq 1 60); do
              PACKAGE_STATE="$(adb shell service check package 2>&1 | tr -d '\r')"
              ACTIVITY_STATE="$(adb shell service check activity 2>&1 | tr -d '\r')"
              echo "check $i: package=$PACKAGE_STATE; activity=$ACTIVITY_STATE" | tee -a app/build/diagnostics/emulator-readiness.txt
              if echo "$PACKAGE_STATE" | grep -qi "found" && echo "$ACTIVITY_STATE" | grep -qi "found"; then
                SERVICE_READY=1
                break
              fi
              sleep 5
            done
            if [ "$SERVICE_READY" -ne 1 ]; then
              echo "Android system services never became ready; skipping test installation." | tee -a app/build/diagnostics/emulator-readiness.txt
              adb logcat -b all -d -v threadtime > app/build/diagnostics/emulator-logcat.txt 2>&1
              adb shell getprop > app/build/diagnostics/emulator-properties.txt 2>&1
              exit 1
            fi
            gradle --no-daemon connectedDebugAndroidTest
            TEST_EXIT=$?
            adb logcat -b all -d -v threadtime > app/build/diagnostics/emulator-logcat.txt 2>&1
            adb shell getprop > app/build/diagnostics/emulator-properties.txt 2>&1
            adb shell dumpsys activity > app/build/diagnostics/activity-dump.txt 2>&1
            exit $TEST_EXIT
      - name: Upload Android test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MathMotorVideo-android-test-diagnostics
          path: |
            app/build/diagnostics/**
            app/build/reports/androidTests/connected/debug/**
            app/build/outputs/androidTest-results/connected/debug/**
          if-no-files-found: warn
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MathMotorVideo-restored-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
