name: Build MathMotorVideo APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, fix/video-playback-clean-ui ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Run unit tests and build APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Run Android editor end-to-end test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: gradle --no-daemon connectedDebugAndroidTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MathMotorVideo-restored-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
