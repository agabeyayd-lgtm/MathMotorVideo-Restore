name: Build and publish APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: |
          gradle --version
          gradle --no-daemon assembleDebug testDebugUnitTest
      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MathMotorVideo.apk
      - name: Read app version
        id: app_version
        run: echo "code=$(grep -E 'versionCode[[:space:]]*=' app/build.gradle.kts | head -1 | grep -oE '[0-9]+')" >> "$GITHUB_OUTPUT"
      - name: Publish latest APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v8.1-${{ github.run_number }}
          name: MathMotor Video APK build ${{ github.run_number }}
          body: "versionCode=${{ steps.app_version.outputs.code }}"
          make_latest: true
          files: MathMotorVideo.apk
