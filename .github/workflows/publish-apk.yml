name: Build and publish APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore persistent release signing key
        id: signing
        env:
          MMV_SIGNING_BUNDLE_B64: ${{ secrets.MMV_SIGNING_BUNDLE_B64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mmv-signing"
          if [ -n "$MMV_SIGNING_BUNDLE_B64" ]; then
            printf '%s' "$MMV_SIGNING_BUNDLE_B64" | base64 --decode > "$RUNNER_TEMP/mmv-signing/bundle.zip"
            unzip -oq "$RUNNER_TEMP/mmv-signing/bundle.zip" -d "$RUNNER_TEMP/mmv-signing"
          elif [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mmv-signing/release.p12"
            {
              printf 'storeFile=release.p12\n'
              printf 'storeType=PKCS12\n'
              printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
              printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
              printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            } > "$RUNNER_TEMP/mmv-signing/keystore.properties"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Signing key secret is missing; no installable APK release will be published."
            {
              echo "## APK release not published"
              echo "Add repository Actions secret `MMV_SIGNING_BUNDLE_B64` or use the existing Android keystore secrets to publish."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test -s "$RUNNER_TEMP/mmv-signing/release.p12"
          test -s "$RUNNER_TEMP/mmv-signing/keystore.properties"
          echo "MMV_SIGNING_PROPERTIES=$RUNNER_TEMP/mmv-signing/keystore.properties" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build signed release APK
        if: steps.signing.outputs.configured == 'true'
        run: gradle --no-daemon assembleRelease

      - name: Prepare release APK
        if: steps.signing.outputs.configured == 'true'
        run: cp app/build/outputs/apk/release/app-release.apk MathMotorVideo.apk

      - name: Read app version
        if: steps.signing.outputs.configured == 'true'
        id: app_version
        run: echo "code=$(grep -E 'versionCode[[:space:]]*=' app/build.gradle.kts | head -1 | grep -oE '[0-9]+')" >> "$GITHUB_OUTPUT"

      - name: Publish latest signed APK
        if: steps.signing.outputs.configured == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v8.3-${{ github.run_number }}
          name: MathMotor Video signed APK build ${{ github.run_number }}
          body: "versionCode=${{ steps.app_version.outputs.code }}"
          make_latest: true
          files: MathMotorVideo.apk

# Rebuild after release-signing secret was refreshed.
