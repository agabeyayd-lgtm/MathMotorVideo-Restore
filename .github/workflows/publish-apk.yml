name: Build and publish APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MathMotorVideo.apk
      - name: Publish latest APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v8.0-${{ github.run_number }}
          name: MathMotor Video APK build ${{ github.run_number }}
          make_latest: true
          files: MathMotorVideo.apk
