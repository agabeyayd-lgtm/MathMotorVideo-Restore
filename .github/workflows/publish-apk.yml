name: Build and publish APK

on:
  # A merge must not publish a public APK automatically. Run only for an approved release.
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build-and-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore persistent release signing key
        id: signing
        env:
          MMV_SIGNING_BUNDLE_B64: ${{ secrets.MMV_SIGNING_BUNDLE_B64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mmv-signing"
          if [ -n "$MMV_SIGNING_BUNDLE_B64" ]; then
            printf '%s' "$MMV_SIGNING_BUNDLE_B64" | base64 --decode > "$RUNNER_TEMP/mmv-signing/bundle.zip"
            unzip -oq "$RUNNER_TEMP/mmv-signing/bundle.zip" -d "$RUNNER_TEMP/mmv-signing"
          elif [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mmv-signing/release.p12"
            {
              printf 'storeFile=release.p12\n'
              printf 'storeType=PKCS12\n'
              printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
              printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
              printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            } > "$RUNNER_TEMP/mmv-signing/keystore.properties"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Signing key secret is missing; no installable APK release will be published."
            {
              echo "## APK release not published"
              echo "Add repository Actions secret `MMV_SIGNING_BUNDLE_B64` or use the existing Android keystore secrets to publish."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test -s "$RUNNER_TEMP/mmv-signing/release.p12"
          test -s "$RUNNER_TEMP/mmv-signing/keystore.properties"

          # PKCS12 private-key entries use the keystore password for key retrieval.
          # Normalize keyPassword from storePassword without printing either value.
          python3 - "$RUNNER_TEMP/mmv-signing/keystore.properties" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          lines = path.read_text(encoding="ISO-8859-1").splitlines(keepends=True)

          def raw_value(prefix):
              for line in lines:
                  if line.startswith(prefix):
                      return line[len(prefix):].rstrip("\\r\\n")
              return None

          store_type = raw_value("storeType=") or "PKCS12"
          if store_type.strip().upper() == "PKCS12":
              store_password = raw_value("storePassword=")
              if store_password is None:
                  raise SystemExit("Signing configuration is missing storePassword.")
              replaced = False
              output = []
              for line in lines:
                  if line.startswith("keyPassword="):
                      ending = "\\r\\n" if line.endswith("\\r\\n") else ("\\n" if line.endswith("\\n") else "")
                      output.append("keyPassword=" + store_password + ending)
                      replaced = True
                  else:
                      output.append(line)
              if not replaced:
                  output.append("keyPassword=" + store_password + "\\n")
              path.write_text("".join(output), encoding="ISO-8859-1")
              print("PKCS12 signing password configuration normalized.")
          else:
              print("Non-PKCS12 signing configuration preserved.")
          PY

          echo "MMV_SIGNING_PROPERTIES=$RUNNER_TEMP/mmv-signing/keystore.properties" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build signed release APK
        if: steps.signing.outputs.configured == 'true'
        run: gradle --no-daemon assembleRelease

      - name: Prepare release APK
        if: steps.signing.outputs.configured == 'true'
        run: cp app/build/outputs/apk/release/app-release.apk MathMotorVideo.apk

      - name: Read app version
        if: steps.signing.outputs.configured == 'true'
        id: app_version
        run: |
          code="$(grep -E 'versionCode[[:space:]]*=' app/build.gradle.kts | head -1 | grep -oE '[0-9]+')"
          name="$(sed -nE 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          test -n "$code"
          test -n "$name"
          {
            echo "code=$code"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"

      - name: Verify versionCode is newer than latest release
        if: steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_CODE: ${{ steps.app_version.outputs.code }}
        run: |
          latest_code="$(curl -fsSL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest"             | python3 -c 'import json,re,sys; body=json.load(sys.stdin).get("body",""); match=re.search(r"versionCode\\s*=\\s*(\\d+)", body, re.I); print(match.group(1) if match else "")')"
          if [ -z "$latest_code" ]; then
            echo "::error::Could not read versionCode from the latest release; refusing to publish."
            exit 1
          fi
          if [ "$CURRENT_CODE" -le "$latest_code" ]; then
            echo "::error::Current versionCode $CURRENT_CODE must be higher than latest release versionCode $latest_code."
            exit 1
          fi

      - name: Publish latest signed APK
        if: steps.signing.outputs.configured == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ steps.app_version.outputs.name }}-${{ github.run_number }}
          name: MathMotor Video ${{ steps.app_version.outputs.name }} signed APK build ${{ github.run_number }}
          body: |
            versionCode=${{ steps.app_version.outputs.code }}
            versionName=${{ steps.app_version.outputs.name }}
          make_latest: true
          files: MathMotorVideo.apk

