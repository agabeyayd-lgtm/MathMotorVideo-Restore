name: Layout branch unit tests (no APK)

on:
  push:
    branches:
      - feature/capcut-layout-recompose

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run JVM unit tests only (no APK packaging)
        run: gradle --no-daemon testDebugUnitTest
